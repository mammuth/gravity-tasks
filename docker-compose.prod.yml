services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VITE_RAILS_API_URL: ${VITE_RAILS_API_URL:-}
    restart: unless-stopped
    # Serves both the API and the frontend; 8080 kept so existing proxies keep working.
    ports:
      - "3000:3000"
      - "8080:3000"
    volumes:
      - ./backend/storage:/app/storage
