services:
  backend:
    image: rust:1.99-slim-bookworm
    restart: unless-stopped
    working_dir: /app/backend
    volumes:
      - .:/app
      - cargo_registry:/usr/local/cargo/registry
    ports:
      - "3000:3000"
    command: cargo run
  frontend:
    image: node:20
    restart: unless-stopped
    working_dir: /app/frontend
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    environment:
      VITE_RAILS_API_URL: ${VITE_RAILS_API_URL:-http://localhost:3000/api}
    command: bash -lc "npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  cargo_registry:
